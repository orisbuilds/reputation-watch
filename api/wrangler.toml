name = "reputation-watch-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# --- D1 database binding ---
# After `npx wrangler d1 create reputation-watch`, paste the returned
# database_id below (replace PASTE_YOUR_D1_DATABASE_ID_HERE).
[[d1_databases]]
binding = "DB"
database_name = "reputation-watch"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"

# --- Non-secret vars ---
# FROM_EMAIL: a Resend-verified sender. Use onboarding@resend.dev while testing,
#             then switch to something like alerts@yourdomain.com once your domain is verified.
# DASHBOARD_URL: link shown in the complaint email (optional).
[vars]
FROM_EMAIL = "onboarding@resend.dev"
DASHBOARD_URL = "https://orisbuilds.github.io/reputation-watch/dashboard.html"

# --- Secrets (DO NOT put here; set via `wrangler secret put`) ---
#   RESEND_API_KEY   -> your Resend API key
#   ADMIN_TOKEN      -> any long random string; protects dentist provisioning
