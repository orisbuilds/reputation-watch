name = "reputation-watch-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Keep the variables already set on the live Worker (FROM_EMAIL = alerts@trychairside.com,
# DASHBOARD_URL). They are deliberately NOT listed here: listing them would overwrite the
# live values on deploy — the old file had FROM_EMAIL = onboarding@resend.dev, which would
# have silently broken complaint emails to clinics.
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "reputation-watch"
database_id = "f16dec53-7d76-4967-ae59-8404a7befd71"
